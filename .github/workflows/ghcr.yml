name: Build and publish Taskly to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskly-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ahmadnurhidayat-23/taskly
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run Laravel tests in Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          cache-from: type=gha,scope=taskly-tests
          cache-to: type=gha,mode=max,scope=taskly-tests

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: taskly:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=taskly-runtime
          cache-to: type=gha,mode=max,scope=taskly-runtime

      - name: Verify running container before publishing
        run: bash docker/smoke-test.sh taskly:ci

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        run: |
          docker tag taskly:ci "$IMAGE:latest"
          docker tag taskly:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          {
            echo '### Taskly berhasil diuji dan dipublikasikan'
            echo "Image: \`$IMAGE:latest\`"
            echo "Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo 'Pengujian: Laravel, HTTP, aset, CSRF, CRUD, dan persistensi volume.'
          } >> "$GITHUB_STEP_SUMMARY"
